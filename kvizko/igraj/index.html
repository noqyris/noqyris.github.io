<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0d1526">
<meta name="description" content="KVIZKO: kviz znanja na srpskom. 6.000+ pitanja, objašnjenje uz svaki odgovor i dvoboj uživo sa drugarom.">
<title>KVIZKO: Kviz znanja</title>
<link rel="icon" href="icon.webp" type="image/webp">
<!--
  KVIZKO landing page. The campaign code `c` (only ^[a-z0-9_]{1,40}$) goes into the App Store `ct`
  and the Google Play `referrer`. No trackers, no cookies, no external files, no automatic redirect.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --line: #26344f;
    --text: #eef2fb;
    --muted: #9eabc4;
    --gold: #ffc940;
    --teal: #2dd4bf;
    --ink: #15110a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(110% 55% at 50% 0%, rgba(45, 212, 191, .14) 0%, rgba(45, 212, 191, 0) 60%),
      linear-gradient(180deg, #121d33 0%, #0b1220 55%, #090e19 100%);
    font: 16px/1.5 ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system,
          "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--teal); }
  .page {
    max-width: 30rem; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 20px 8px;
  }
  .hero { text-align: center; }
  .icon {
    display: block; width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 22px;
    box-shadow: 0 12px 32px rgba(255, 201, 64, .22), 0 0 0 1px rgba(255, 255, 255, .07);
  }
  h1 {
    margin: 0; color: var(--gold); font-size: 2.6rem; line-height: 1.05;
    font-weight: 900; letter-spacing: .05em;
  }
  .kicker {
    margin: 4px 0 0; color: var(--teal); font-size: .82rem; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase;
  }
  .lead {
    margin: 16px auto 24px; max-width: 24rem;
    font-size: 1.16rem; font-weight: 700; line-height: 1.42;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 60px; padding: 14px 24px; border-radius: 999px;
    background: linear-gradient(180deg, #ffd96b 0%, #f6b62b 100%);
    color: var(--ink); font-size: 1.18rem; font-weight: 900; text-decoration: none;
    box-shadow: 0 10px 26px rgba(246, 182, 43, .32), inset 0 -3px 0 rgba(0, 0, 0, .14);
    -webkit-tap-highlight-color: transparent;
  }
  .btn svg { flex: none; }
  .btn:active { transform: translateY(1px); box-shadow: 0 6px 16px rgba(246, 182, 43, .3), inset 0 -2px 0 rgba(0, 0, 0, .14); }
  .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .free { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }
  .alt { margin: 4px 0 0; color: var(--muted); font-size: .98rem; }
  .alt a { font-weight: 800; text-underline-offset: 3px; }

  .clip { margin: 32px 0 0; }
  .clip video {
    display: block; width: 100%; height: auto; aspect-ratio: 6 / 7;
    border-radius: 24px; border: 1px solid var(--line); background: #151b2a;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
  }
  .clip figcaption { margin: 10px 4px 0; color: var(--muted); font-size: .9rem; text-align: center; }

  h2 { margin: 36px 0 12px; font-size: 1.2rem; font-weight: 900; text-align: center; }
  .shots {
    display: flex; gap: 12px; margin: 0 -20px; padding: 0 20px 6px;
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .shots::-webkit-scrollbar { display: none; }
  .shots img {
    flex: 0 0 62%; max-width: 250px; height: auto; scroll-snap-align: center;
    border-radius: 18px; border: 1px solid var(--line);
  }

  .again { margin: 36px 0 0; text-align: center; }
  .again p { margin: 0 0 14px; font-size: 1.3rem; font-weight: 900; color: var(--gold); }

  footer {
    max-width: 30rem; margin: 40px auto 0; padding: 18px 20px max(28px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; text-align: center;
  }
  footer a { color: var(--muted); }

  @media (min-width: 760px) {
    .page {
      max-width: 60rem; padding-top: 64px;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 24rem);
      column-gap: 64px; align-items: center;
    }
    .hero { text-align: left; }
    .icon { margin: 0 0 18px; }
    h1 { font-size: 3.2rem; }
    .lead { margin-left: 0; font-size: 1.3rem; }
    .btn { display: inline-flex; width: auto; min-width: 21rem; }
    .clip { margin: 0; }
    .shots-wrap { grid-column: 1 / -1; }
    .shots { margin: 0; padding: 0; justify-content: center; overflow: visible; }
    .shots img { flex: 0 1 250px; }
    .again { grid-column: 1 / -1; }
    footer { max-width: 60rem; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <img class="icon" src="icon.webp" width="96" height="96" alt="">
    <h1>KVIZKO</h1>
    <p class="kicker">Kviz znanja</p>
    <p class="lead">Kviz znanja na srpskom: 6.000+ pitanja, objašnjenje uz svaki odgovor, dvoboj uživo sa drugarom.</p>
    <a class="btn js-primary" href="https://apps.apple.com/app/id6793550562">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 3h2v10.17l3.59-3.58L18 11l-6 6-6-6 1.41-1.41L11 13.17zM5 19h14v2H5z"/></svg>
      <span class="js-primary-label">Preuzmi na App Store-u</span>
    </a>
    <p class="free">Besplatno</p>
    <p class="alt"><span class="js-alt-prefix">Android:</span> <a class="js-secondary" href="https://play.google.com/store/apps/details?id=com.noqyris.kvizko">Google Play</a></p>
  </section>

  <figure class="clip">
    <video src="kvizko.mp4" poster="poster.webp" width="720" height="840"
           autoplay muted loop playsinline disablepictureinpicture disableremoteplayback preload="auto"
           aria-label="Snimak iz igre: dva tačna odgovora zaredom u načinu Preživi"></video>
    <figcaption>Snimak iz igre, način „Preživi“: igraš dok ne pogrešiš.</figcaption>
  </figure>

  <section class="shots-wrap" aria-labelledby="iz-igre">
    <h2 id="iz-igre">Iz igre</h2>
    <div class="shots">
      <img src="objasnjenje.webp" width="540" height="1171" loading="lazy" alt="Uz svaki odgovor objašnjenje: igraš i usput naučiš.">
      <img src="dvoboj.webp" width="540" height="1171" loading="lazy" alt="Dvoboj uživo: nasumični protivnik ili prijatelj.">
      <img src="nacini.webp" width="540" height="1171" loading="lazy" alt="Glavni meni: pet načina igre i dvoboj uživo.">
    </div>
  </section>

  <section class="again">
    <p>Koliko stvarno znaš?</p>
    <a class="btn js-primary" href="https://apps.apple.com/app/id6793550562">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 3h2v10.17l3.59-3.58L18 11l-6 6-6-6 1.41-1.41L11 13.17zM5 19h14v2H5z"/></svg>
      <span class="js-primary-label">Preuzmi na App Store-u</span>
    </a>
  </section>
</main>

<footer>
  <a href="../privacy.html">Politika privatnosti</a> · <a href="../">Podrška</a> · © 2026 Noqyris
</footer>

<script>
(function () {
  var IOS_ID = '6793550562';
  var PLAY_ID = 'com.noqyris.kvizko';

  // Campaign code: only lowercase letters, digits and "_", 1 to 40 characters; anything else is ignored.
  var c = null;
  try { c = new URLSearchParams(location.search).get('c'); } catch (e) { c = null; }
  if (typeof c !== 'string' || !/^[a-z0-9_]{1,40}$/.test(c)) c = null;

  var appStore = c
    ? 'https://apps.apple.com/app/apple-store/id' + IOS_ID + '?pt=128628628&ct=' + c + '&mt=8'
    : 'https://apps.apple.com/app/id' + IOS_ID;
  var play = 'https://play.google.com/store/apps/details?id=' + PLAY_ID + (c
    ? '&referrer=' + encodeURIComponent('utm_source=meta&utm_medium=paid_social&utm_campaign=' + c)
    : '');

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = !isAndroid && (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1));

  function each(sel, fn) { var n = document.querySelectorAll(sel); for (var i = 0; i < n.length; i++) fn(n[i]); }

  each('.js-primary', function (a) { a.setAttribute('href', isAndroid ? play : appStore); });
  each('.js-primary-label', function (s) { s.textContent = isAndroid ? 'Preuzmi na Google Play-u' : 'Preuzmi na App Store-u'; });
  each('.js-secondary', function (a) {
    a.setAttribute('href', isAndroid ? appStore : play);
    a.textContent = isAndroid ? 'App Store' : 'Google Play';
  });
  each('.js-alt-prefix', function (s) { s.textContent = isAndroid ? 'Imaš iPhone?' : (isIOS ? 'Imaš Android?' : 'Android:'); });

  // Respect "reduce motion": no autoplay, show controls instead.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    each('video', function (v) { v.removeAttribute('autoplay'); v.pause(); v.controls = true; });
  }
})();
</script>
</body>
</html>

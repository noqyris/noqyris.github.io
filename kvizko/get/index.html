<script>
// One link for every post: route by device. iPhone/iPad → the App Store page;
// Android → the Google Play page (KVIZKO is in Play production since 2026-10-21);
// desktop → the landing page.
(function () {
  var APP_STORE = 'https://apps.apple.com/app/id6793550562';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.noqyris.kvizko';
  var LANDING = '../';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  if (isIOS) location.replace(APP_STORE);
  else if (isAndroid) location.replace(PLAY);
  else location.replace(LANDING);
})();
</script>
